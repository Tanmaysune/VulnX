<svg xmlns="http://www.w3.org/2000/svg" width="660" height="256" viewBox="0 0 660 256" role="img" aria-label="VulnX">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14101c"/>
      <stop offset="1" stop-color="#0b0810"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3fb4"/>
      <stop offset="0.5" stop-color="#e935ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="letters">
      <g fill="#ffffff">
    <rect x="40" y="46" width="18" height="18" rx="2"/>
    <rect x="120" y="46" width="18" height="18" rx="2"/>
    <rect x="40" y="66" width="18" height="18" rx="2"/>
    <rect x="120" y="66" width="18" height="18" rx="2"/>
    <rect x="40" y="86" width="18" height="18" rx="2"/>
    <rect x="120" y="86" width="18" height="18" rx="2"/>
    <rect x="40" y="106" width="18" height="18" rx="2"/>
    <rect x="120" y="106" width="18" height="18" rx="2"/>
    <rect x="60" y="126" width="18" height="18" rx="2"/>
    <rect x="100" y="126" width="18" height="18" rx="2"/>
    <rect x="60" y="146" width="18" height="18" rx="2"/>
    <rect x="100" y="146" width="18" height="18" rx="2"/>
    <rect x="80" y="166" width="18" height="18" rx="2"/>
    <rect x="160" y="46" width="18" height="18" rx="2"/>
    <rect x="240" y="46" width="18" height="18" rx="2"/>
    <rect x="160" y="66" width="18" height="18" rx="2"/>
    <rect x="240" y="66" width="18" height="18" rx="2"/>
    <rect x="160" y="86" width="18" height="18" rx="2"/>
    <rect x="240" y="86" width="18" height="18" rx="2"/>
    <rect x="160" y="106" width="18" height="18" rx="2"/>
    <rect x="240" y="106" width="18" height="18" rx="2"/>
    <rect x="160" y="126" width="18" height="18" rx="2"/>
    <rect x="240" y="126" width="18" height="18" rx="2"/>
    <rect x="160" y="146" width="18" height="18" rx="2"/>
    <rect x="240" y="146" width="18" height="18" rx="2"/>
    <rect x="180" y="166" width="18" height="18" rx="2"/>
    <rect x="200" y="166" width="18" height="18" rx="2"/>
    <rect x="220" y="166" width="18" height="18" rx="2"/>
    <rect x="280" y="46" width="18" height="18" rx="2"/>
    <rect x="280" y="66" width="18" height="18" rx="2"/>
    <rect x="280" y="86" width="18" height="18" rx="2"/>
    <rect x="280" y="106" width="18" height="18" rx="2"/>
    <rect x="280" y="126" width="18" height="18" rx="2"/>
    <rect x="280" y="146" width="18" height="18" rx="2"/>
    <rect x="280" y="166" width="18" height="18" rx="2"/>
    <rect x="300" y="166" width="18" height="18" rx="2"/>
    <rect x="320" y="166" width="18" height="18" rx="2"/>
    <rect x="340" y="166" width="18" height="18" rx="2"/>
    <rect x="360" y="166" width="18" height="18" rx="2"/>
    <rect x="400" y="46" width="18" height="18" rx="2"/>
    <rect x="480" y="46" width="18" height="18" rx="2"/>
    <rect x="400" y="66" width="18" height="18" rx="2"/>
    <rect x="420" y="66" width="18" height="18" rx="2"/>
    <rect x="480" y="66" width="18" height="18" rx="2"/>
    <rect x="400" y="86" width="18" height="18" rx="2"/>
    <rect x="420" y="86" width="18" height="18" rx="2"/>
    <rect x="480" y="86" width="18" height="18" rx="2"/>
    <rect x="400" y="106" width="18" height="18" rx="2"/>
    <rect x="440" y="106" width="18" height="18" rx="2"/>
    <rect x="480" y="106" width="18" height="18" rx="2"/>
    <rect x="400" y="126" width="18" height="18" rx="2"/>
    <rect x="460" y="126" width="18" height="18" rx="2"/>
    <rect x="480" y="126" width="18" height="18" rx="2"/>
    <rect x="400" y="146" width="18" height="18" rx="2"/>
    <rect x="460" y="146" width="18" height="18" rx="2"/>
    <rect x="480" y="146" width="18" height="18" rx="2"/>
    <rect x="400" y="166" width="18" height="18" rx="2"/>
    <rect x="480" y="166" width="18" height="18" rx="2"/>
    <rect x="520" y="46" width="18" height="18" rx="2"/>
    <rect x="600" y="46" width="18" height="18" rx="2"/>
    <rect x="520" y="66" width="18" height="18" rx="2"/>
    <rect x="600" y="66" width="18" height="18" rx="2"/>
    <rect x="540" y="86" width="18" height="18" rx="2"/>
    <rect x="580" y="86" width="18" height="18" rx="2"/>
    <rect x="560" y="106" width="18" height="18" rx="2"/>
    <rect x="540" y="126" width="18" height="18" rx="2"/>
    <rect x="580" y="126" width="18" height="18" rx="2"/>
    <rect x="520" y="146" width="18" height="18" rx="2"/>
    <rect x="600" y="146" width="18" height="18" rx="2"/>
    <rect x="520" y="166" width="18" height="18" rx="2"/>
    <rect x="600" y="166" width="18" height="18" rx="2"/>
      </g>
    </mask>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="660" height="256" rx="16" fill="url(#panel)"/>
  <rect x="1.5" y="1.5" width="657" height="253" rx="15" fill="none" stroke="#ff3fb4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- wordmark (with a soft glow pulse) -->
  <g filter="url(#glow)">
    <g fill="url(#ink)" mask="url(#letters)">
      <rect x="0" y="0" width="660" height="256"/>
    </g>
    <animate attributeName="opacity" values="1;0.82;1" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- animated shine sweeping across the letters -->
  <g mask="url(#letters)">
    <rect x="0" y="0" width="180" height="256" fill="url(#shine)" opacity="0.55">
      <animate attributeName="x" from="-200" to="660" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline -->
  <g transform="translate(330, 226)" text-anchor="middle" font-family="'Courier New', monospace">
    <text x="0" y="0" fill="#c9b8e8" font-size="17" letter-spacing="4" font-weight="bold">WEBSITE RECON &amp; VULNERABILITY ASSESSMENT</text>
    <rect x="196" y="-14" width="10" height="18" fill="#ff3fb4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
